<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Group -->
  <g transform="translate(20, 15)">
    <!-- Circuit Base Node Lines -->
    <path d="M45,85 L45,55 L25,40" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M45,55 L65,40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M45,35 L45,15" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />
    
    <!-- Pulse Ring Signal Waves -->
    <path d="M72,25 A38,38 0 0,1 78,55" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M78,18 A48,48 0 0,1 86,62" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6" stroke-dasharray="3,3" />

    <!-- Organic Tech Leaf Silhouette Left -->
    <path d="M45,65 C20,60 10,40 22,20 C32,32 40,42 45,65 Z" fill="url(#leafGrad)" />
    
    <!-- Organic Tech Leaf Silhouette Right with Circuit Vanes -->
    <path d="M45,65 C70,60 80,35 68,15 C58,28 50,42 45,65 Z" fill="url(#leafGrad)" opacity="0.9" />
    
    <!-- Center Stem / Antenna Node -->
    <line x1="45" y1="75" x2="45" y2="12" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    
    <!-- Circuit Connection Dots -->
    <circle cx="25" cy="40" r="4" fill="#38bdf8" />
    <circle cx="65" cy="40" r="4" fill="#22c55e" />
    <circle cx="45" cy="12" r="5" fill="#4ade80" filter="url(#subtleGlow)" />
    <circle cx="45" cy="85" r="4.5" fill="#10b981" />
  </g>

  <!-- Typography Brand: AGRO-IOT -->
  <g transform="translate(130, 62)">
    <text font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" letter-spacing="2" fill="#ffffff">
      AGRO<tspan fill="#22c55e">-</tspan><tspan fill="#38bdf8">IOT</tspan>
    </text>
  </g>

  <!-- Tagline: Smart Farming. Smarter Decisions. -->
  <g transform="translate(132, 92)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14.5" letter-spacing="1.5" fill="#94a3b8">
      SMART FARMING<tspan fill="#22c55e">.</tspan> SMARTER DECISIONS<tspan fill="#38bdf8">.</tspan>
    </text>
  </g>
</svg>
